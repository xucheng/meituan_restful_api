version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: meituan
      MYSQL_PASSWORD: meituan123
      MYSQL_DATABASE: meituan
      MONGODB_URI: mongodb://mongo/
    depends_on:
      - mysql
      - mongo
    restart: unless-stopped

  mysql:
    image: mysql:5.6
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: meituan
      MYSQL_USER: meituan
      MYSQL_PASSWORD: meituan123
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  mongo:
    image: mongo:3.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mysql_data:
  mongo_data:
